# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Linting/Testing

on:
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
      - reopened
      - labeled
      - synchronize

jobs:
  js-ts:
    name: Javascript/Typescript linting/testing
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: install dependencies
        run: |
          npm ci
      - name: linting
        run: |
          npm run lint:ci
      - name: type checking
        run: |
          npm run tsc:check
      - name: type checking
        run: |
          npm run tsc:check
      - name: tests
        run: |
          npm run test
